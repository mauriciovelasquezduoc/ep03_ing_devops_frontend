# values.yaml - Configuración de Kubernetes para el proyecto frontend
# Este proyecto se instala de forma independiente (repo autónomo).

# Namespace compartido por los 3 proyectos.
# DEBE coincidir con NAMESPACE en ep03_ing_devops_database y ep03_ing_devops_backend
NAMESPACE=ep03

# Imagen ECR — la cuenta se resuelve en runtime desde AWS STS (apply.sh),
# por lo que aquí se deja el placeholder <AWSAccountId>.
FRONTEND_IMAGE=<AWSAccountId>.dkr.ecr.us-east-1.amazonaws.com/ep03-frontend:latest

# Frontend
FRONTEND_PORT=80
FRONTEND_REPLICAS=2
FRONTEND_CPU_REQUEST=50m
FRONTEND_CPU_LIMIT=300m
FRONTEND_MEM_REQUEST=64Mi
FRONTEND_MEM_LIMIT=256Mi
FRONTEND_HPA_MIN=2
FRONTEND_HPA_MAX=6
FRONTEND_HPA_CPU=60
