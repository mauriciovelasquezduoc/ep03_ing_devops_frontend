# ============================================================================
# Pipeline de calidad de código - frontend ep03 (React + Vite)
#
# Equivalente al pipeline del backend (calidad-codigo.yml), adaptado al stack
# del frontend.
#
# UBICACIÓN (crítico): GitHub Actions SOLO ejecuta los workflows que están en
# `.github/workflows/` en la RAIZ del repositorio. Este archivo debe quedar así:
#
#     <repo>/
#     |-- .github/workflows/calidad-codigo.yml   <-- este archivo
#     |-- package.json
#     `-- src/
#
# Equivalencias backend (Gradle) -> frontend (npm):
#   Spotless      <-> Prettier        (npm run format:check)
#   Checkstyle/PMD<-> ESLint          (npm run lint)
#   Test (JUnit)  <-> Vitest          (npm test)
#   PIT (mutación)<-> Stryker         (npm run test:mutation)
#   JaCoCo        <-> cobertura v8    (npm run test:coverage)
#   SonarQube     <-> SonarCloud      (sonarcloud-github-action)
#   Snyk          <-> Snyk            (snyk test)
#   Docker+Trivy  <-> Docker+Trivy
#   DAST (ZAP)    <-> DAST (ZAP)
#   Gatling/JMeter<-> Lighthouse      (rendimiento del frontend)
#
# Secrets necesarios (Settings > Secrets and variables > Actions):
#   SONAR_TOKEN, SNYK_TOKEN
# ============================================================================

name: Calidad de código

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: calidad-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  # ============================================================
  # 1. PRETTIER - formato de código
  # ============================================================
  prettier:
    name: Prettier (formato de código)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalar dependencias
        run: npm install

      - name: Verificar formato con Prettier
        run: npm run format:check

  # ============================================================
  # 2. ESLINT - convenciones y code smells
  # ============================================================
  eslint:
    name: ESLint (lint / convenciones)
    needs: prettier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalar dependencias
        run: npm install

      - name: Analizar con ESLint
        run: npm run lint

      - name: Subir reporte de ESLint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: reports/eslint/
          if-no-files-found: ignore
          retention-days: 7

  # ============================================================
  # 3. TEST - pruebas unitarias (Vitest)
  # ============================================================
  test:
    name: Pruebas unitarias (Vitest)
    needs: eslint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar pruebas unitarias
        run: npm test

  # ============================================================
  # 4. COVERAGE - cobertura de pruebas (v8, umbral 90%)
  # ============================================================
  coverage:
    name: Cobertura (Vitest v8)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalar dependencias
        run: npm install

      - name: Verificar cobertura (umbral 90%)
        run: npm run test:coverage

      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  # ============================================================
  # 5. MUTATION - pruebas de mutación (Stryker)
  # ============================================================
  mutation:
    name: Mutación (Stryker)
    needs: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalar dependencias
        run: npm install

      - name: Restaurar incremental de Stryker (cache)
        uses: actions/cache@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            stryker-incremental-${{ github.ref }}-
            stryker-incremental-

      - name: Ejecutar pruebas de mutación con Stryker
        run: npm run test:mutation

      - name: Subir reporte de Stryker
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore
          retention-days: 7

  # ============================================================
  # 6. SONARQUBE - calidad (SonarCloud)
  # ============================================================
  sonarqube:
    name: SonarCloud (calidad)
    needs: mutation
    continue-on-error: true   # no bloquea el deploy
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalar dependencias
        run: npm install

      - name: Generar cobertura (lcov)
        run: npm run test:coverage

      - name: Aviso si falta SONAR_TOKEN
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "::warning::SONAR_TOKEN no configurado; se omite el análisis de SonarCloud."

      - name: Análisis con SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarcloud-github-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ============================================================
  # 7. SNYK - seguridad de dependencias
  # ============================================================
  snyk:
    name: Snyk (seguridad de dependencias)
    needs: sonarqube
    continue-on-error: true   # no bloquea el deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalar dependencias
        run: npm install

      - name: Instalar Snyk CLI
        run: npm install -g snyk@latest

      - name: Analizar dependencias con Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::warning::SNYK_TOKEN no configurado; se omite el análisis de Snyk."
            exit 0
          fi
          snyk test --file=package.json --severity-threshold=critical

  # ============================================================
  # 8. CONTAINER - Docker + Trivy
  # ============================================================
  container:
    name: Contenedor (Docker + Trivy)
    needs: snyk
    continue-on-error: true   # no bloquea el deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Construir la imagen Docker
        run: docker build -t ep03-frontend:${{ github.sha }} .

      - name: Escanear la imagen con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ep03-frontend:${{ github.sha }}
          vuln-type: 'os'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  # ============================================================
  # 9. DAST - OWASP ZAP (baseline)
  # ============================================================
  dast:
    name: DAST (OWASP ZAP)
    needs: container
    continue-on-error: true   # no bloquea el deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalar dependencias
        run: npm install

      - name: Construir y servir el frontend
        run: |
          npm run build
          nohup npm run preview -- --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4173/ >/dev/null; then echo "Frontend listo"; exit 0; fi
            sleep 2
          done
          echo "El frontend no respondió a tiempo" >&2
          cat preview.log
          exit 1

      - name: Escanear con ZAP (baseline)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'http://localhost:4173'
          cmd_options: '-i'
          fail_action: 'true'
          allow_issue_writing: 'false'

      - name: Subir log del preview (si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dast-preview-log
          path: preview.log
          if-no-files-found: ignore

      - name: Detener el servidor
        if: always()
        run: pkill -f 'vite preview' || true

  # ============================================================
  # 10. PERFORMANCE - Lighthouse CI
  # ============================================================
  performance:
    name: Rendimiento (Lighthouse)
    needs: dast
    continue-on-error: true   # no bloquea el deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalar dependencias
        run: npm install

      - name: Construir el frontend
        run: npm run build

      - name: Ejecutar Lighthouse CI
        run: npm run lighthouse

      - name: Subir reporte de Lighthouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 7

  # ============================================================
  # METRICAS CI/CD - publicacion a AWS CloudWatch (IE12)
  # ============================================================
  # Publica en Ep03/CI las metricas del pipeline de calidad del frontend
  # para el dashboard "ep03-observabilidad":
  #   - BuildDurationSeconds  : duracion total del run
  #   - TestCoveragePercent   : cobertura de lineas (Vitest v8, json-summary)
  #   - TestsFailed           : tests fallidos (del resumen de Vitest)
  # ============================================================
  metricas-ci:
    name: Métricas CI/CD -> CloudWatch (Ep03/CI)
    needs: [prettier, eslint, test, coverage, mutation, sonarqube, snyk, container, dast, performance]
    if: always()
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar cobertura para extraer métricas
        id: vitest
        run: |
          set -uo pipefail
          npm run test:coverage > vitest.log 2>&1 || true
          cat vitest.log || true

          # Cobertura de líneas (coverage-summary.json, generado por json-summary)
          if [ -f coverage/coverage-summary.json ]; then
            COVERAGE=$(python3 -c "import json;print(json.load(open('coverage/coverage-summary.json'))['total']['lines']['pct'])")
          else
            echo "::warning::No se encontró coverage/coverage-summary.json"
            COVERAGE=0
          fi
          echo "coverage=${COVERAGE}" >> "$GITHUB_OUTPUT"

          # Tests fallidos (resumen de Vitest: "N failed" / "N passed")
          FAILED=$(grep -oE '[0-9]+ failed' vitest.log | head -1 | grep -o '[0-9]*' || echo 0)
          echo "tests_failed=${FAILED:-0}" >> "$GITHUB_OUTPUT"
          echo "Cobertura: ${COVERAGE}% | Tests fallidos: ${FAILED:-0}"

      - name: Calcular tiempo de build
        if: always()
        id: buildtime
        run: |
          STARTED_AT=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq .run_started_at)
          BUILD_SECONDS=$(( $(date -u +%s) - $(date -u -d "$STARTED_AT" +%s) ))
          echo "build_seconds=${BUILD_SECONDS}" >> "$GITHUB_OUTPUT"

      - name: Configurar credenciales AWS
        if: always()
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION || env.AWS_REGION }}

      - name: Publicar métricas en CloudWatch (namespace Ep03/CI)
        if: always()
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            echo "::warning::Sin AWS_ACCESS_KEY_ID en secrets; métricas CI/CD no publicadas."
            exit 0
          fi
          # Nota: put-metric-data NO acepta --dimensions junto con --metric-data;
          # las dimensiones van dentro de cada entrada MetricData.
          DIMS="Dimensions=[{Name=Repository,Value=${{ github.repository }}},{Name=Branch,Value=${{ github.ref_name }}}]"
          aws cloudwatch put-metric-data \
            --namespace Ep03/CI \
            --region "$AWS_REGION" \
            --metric-data \
              "MetricName=BuildDurationSeconds,Value=${{ steps.buildtime.outputs.build_seconds }},Unit=Seconds,${DIMS}" \
              "MetricName=TestCoveragePercent,Value=${{ steps.vitest.outputs.coverage }},Unit=Percent,${DIMS}" \
              "MetricName=TestsFailed,Value=${{ steps.vitest.outputs.tests_failed }},Unit=Count,${DIMS}"
          echo "Métricas publicadas (Ep03/CI)."
